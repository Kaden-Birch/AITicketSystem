services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app-data:/data
      - app-keys:/keys
    environment:
      AITICKET_DATA: /data
      AITICKET_KEY_FILE: /keys/encryption.key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
volumes:
  app-data:
  app-keys:
