services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${AITICKET_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - app-data:/data
      - app-keys:/keys
      - network-logs:/logs:ro
    environment:
      AITICKET_ALLOW_INSECURE_HTTP: ${AITICKET_ALLOW_INSECURE_HTTP:-0}
      AITICKET_LOG_DATA: /logs/network-logs.db
      AITICKET_DATA: /data
      AITICKET_KEY_FILE: /keys/encryption.key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
  log-receiver:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "aiticket", "log-receiver", "--host", "0.0.0.0", "--port", "5514"]
    ports:
      - "${AITICKET_SYSLOG_BIND_ADDRESS:-127.0.0.1}:5514:5514/udp"
      - "${AITICKET_SYSLOG_BIND_ADDRESS:-127.0.0.1}:5514:5514/tcp"
    volumes:
      - app-data:/data
      - network-logs:/logs
    environment:
      AITICKET_DATA: /data
      AITICKET_LOG_DATA: /logs/network-logs.db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "from aiticket.network_logs import status; import sys; sys.exit(0 if status('/data/app.db')['available'] else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
volumes:
  network-logs:
  app-data:
  app-keys:
