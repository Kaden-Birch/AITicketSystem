name: Publish signed agent release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['agent/**', 'scripts/build-agent-release.py', '.github/workflows/agent-release.yml']
permissions:
  contents: write
concurrency:
  group: agent-stable-publisher
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate independent updater
        run: |
          python -m pip install pytest
          python -m pytest -q --confcutdir=tests/updater tests/updater
          bash -n agent/install.sh
      - name: Sign and publish
        env:
          AGENT_RELEASE_SIGNING_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/agent-release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$AGENT_RELEASE_SIGNING_KEY" > "$key"
          python scripts/build-agent-release.py --key "$key" --output "$RUNNER_TEMP/agent-release"
          version=$(cat "$RUNNER_TEMP/agent-release/version")
          if gh release view "agent-$version" >/dev/null 2>&1; then
            mkdir "$RUNNER_TEMP/existing-agent"
            gh release download "agent-$version" --pattern agent.tar.gz --dir "$RUNNER_TEMP/existing-agent"
            cmp "$RUNNER_TEMP/existing-agent/agent.tar.gz" "$RUNNER_TEMP/agent-release/agent.tar.gz"
          else
            gh release create "agent-$version" "$RUNNER_TEMP/agent-release/agent.tar.gz" --target "$GITHUB_SHA" --title "Agent $version" --notes 'Signed Linux monitoring agent release. Independent updater verifies signature, checksum and heartbeat.' --latest=false
          fi
          if ! gh release view agent-stable >/dev/null 2>&1; then
            gh release create agent-stable --target "$GITHUB_SHA" --title 'Agent stable update channel' --notes 'Signed release manifest for the independent agent updater.' --latest=false
          fi
          gh release upload agent-stable "$RUNNER_TEMP/agent-release/agent-manifest.json" --clobber
