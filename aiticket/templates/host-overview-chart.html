<article class="history-chart" data-live-key="chart-{{ chart.key }}" data-host-chart="{{ chart.key }}"><div class="row"><h3>{{ chart.label }}</h3><strong data-chart-value>Last recorded {{ chart.latest }}{{ chart.unit }}</strong></div><svg viewBox="0 0 600 175" tabindex="0" role="img" aria-label="{{ chart.label }} history. Use left and right arrows to inspect readings."><path class="chart-grid" d="M35 25H565 M35 82H565 M35 140H565"/>{% for line in chart.segments %}<polyline class="chart-line" points="{{ line }}"/>{% if line.split(' ')|length==1 %}<circle class="chart-point" cx="{{ line.split(',')[0] }}" cy="{{ line.split(',')[1] }}" r="3"/>{% endif %}{% endfor %}<line data-chart-cursor x1="35" x2="35" y1="20" y2="140" hidden/><text x="35" y="165">{{ history.start|timestamp }}</text><text x="565" y="165" text-anchor="end">Now</text></svg><small data-chart-time>Min {{ chart.min }}{{ chart.unit }} · Max {{ chart.max }}{{ chart.unit }}</small></article>
