{% extends 'base.html' %}{% block content %}<a href="/hosts">← Hosts</a><h1>Add host</h1><section class="narrow-panel"><form method="post" action="/hosts"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Name<input name="name" required maxlength="100" placeholder="Application server"></label><label>Parent / dependency<select name="parent"><option value="">None</option>{% for m in machines %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}</select></label><button class="primary">Add host</button></form><p class="hint">Open the new host's settings to create its agent enrollment token or link Proxmox inventory.</p></section>{% endblock %}
