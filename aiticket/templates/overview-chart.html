<section class="overview-chart" data-live-key="{{ chart.label }}"><div class="row"><h3>{{ chart.label }}</h3><strong>{{ (chart.latest|string)+chart.unit if chart.latest is not none else '—' }}</strong></div>{% if chart.segments %}<svg viewBox="0 0 600 175" role="img" aria-label="{{ chart.label }} history"><title>{{ chart.label }} · {{ 'last 24 hours' if chart in summary.charts else 'last 30 days' }}</title><path class="chart-grid" d="M35 25H565 M35 82H565 M35 140H565"/><text x="2" y="29">{{ chart.ceiling }}</text><text x="15" y="144">0</text>{% for line in chart.segments %}<polyline class="chart-line" points="{{ line }}"/>{% if line.split(' ')|length==1 %}<circle class="chart-point" cx="{{ line.split(',')[0] }}" cy="{{ line.split(',')[1] }}" r="3"/>{% endif %}{% endfor %}<text x="35" y="165">{{ summary.start|timestamp if chart in summary.charts else summary.date_start }}</text><text x="565" y="165" text-anchor="end">{{ 'Now' if chart in summary.charts else summary.date_end }}</text></svg>{% else %}<p class="chart-empty">No history available yet.</p>{% endif %}</section>
