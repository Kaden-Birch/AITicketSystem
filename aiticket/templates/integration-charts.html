<div class="host-charts">{% for chart in item_history.charts %}<article class="history-chart"><div class="row"><h3>{{ chart.label }}</h3><strong>{{ chart.latest }}{{ chart.unit }}</strong></div><svg viewBox="0 0 600 175" role="img" aria-label="{{ chart.label }} over {{ item_history.window }}"><path class="chart-grid" d="M35 25H565 M35 82H565 M35 140H565"/><text x="2" y="29">{{ chart.ceiling }}</text><text x="15" y="144">0</text>{% for line in chart.segments %}<polyline class="chart-line" points="{{ line }}"/>{% if line.split(' ')|length==1 %}<circle class="chart-point" cx="{{ line.split(',')[0] }}" cy="{{ line.split(',')[1] }}" r="3"/>{% endif %}{% endfor %}<text x="35" y="165">{{ item_history.start|timestamp }}</text><text x="565" y="165" text-anchor="end">Now</text></svg></article>{% else %}<p class="hint">History appears as new readings arrive.</p>{% endfor %}</div>
